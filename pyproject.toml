[project]
name = "build-center"
version = "1.0.0"
description = "Build Center - Full-stack build & packaging platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "pyjwt>=2.8.0",
    "nuitka>=4.1.2",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "psutil>=5.9.0",
    "gputil>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "unit: fast, isolated tests with no DB / network / subprocess",
    "integration: tests that touch external systems",
]
